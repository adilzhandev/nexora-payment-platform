plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.nexora'
    version = '0.1.0'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencyManagement {
        imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16' }
    }
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
        testImplementation 'org.testcontainers:kafka'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += '-parameters'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '768m'
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    }
    tasks.named('test') { useJUnitPlatform { excludeTags 'integration' } }
    tasks.register('integrationTest', Test) {
        description = 'Runs integration tests against real infrastructure.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'integration' }
        shouldRunAfter tasks.named('test')
    }
}

project(':nexora-common') {
    dependencies { api 'com.fasterxml.jackson.core:jackson-databind' }
}

project(':nexora-core') {
    dependencies {
        api project(':nexora-common')
        api 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-json'
        runtimeOnly 'org.postgresql:postgresql'
        testImplementation 'org.liquibase:liquibase-core'
    }
}

project(':nexora-events') {
    dependencies {
        api project(':nexora-common')
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-json'
        implementation 'io.micrometer:micrometer-core'
        runtimeOnly 'org.postgresql:postgresql'
    }
}

configure([project(':nexora-api'), project(':nexora-audit')]) {
    apply plugin: 'org.springframework.boot'
    dependencies {
        implementation project(':nexora-common')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.liquibase:liquibase-core'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
        runtimeOnly 'org.postgresql:postgresql'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        testImplementation 'org.springframework.security:spring-security-test'
    }
    tasks.named('bootJar') { archiveFileName = "${project.name}.jar" }
    tasks.named('jar') { enabled = false }
}

project(':nexora-api') {
    dependencies {
        implementation project(':nexora-core')
        implementation project(':nexora-events')
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.kafka:spring-kafka'
    }
}

project(':nexora-audit') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.kafka:spring-kafka'
    }
}
