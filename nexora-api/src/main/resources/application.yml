server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: nexora-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${DATABASE_USERNAME:nexora}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog-api.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 250ms
      timeout: 250ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 2147483647
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
logging:
  structured:
    format:
      console: logstash
nexora:
  auth:
    token-ttl: PT12H
  company-cache:
    ttl: PT5M
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  events:
    topic: nexora.payments.v1
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
